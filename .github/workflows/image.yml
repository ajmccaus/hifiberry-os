# Checks every part, then builds, boot-tests and publishes the audio-os SD image as a prerelease.
# The image job is the only one with write access; third-party actions are official actions/* only.
name: image

on:
  push:
    branches: [master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (bash -n, shellcheck)
        run: |
          mapfile -t bash_scripts < <(git ls-files '*.sh' os/rootfs/usr/lib/audio-os/kiosk-rotation os/rootfs/usr/lib/audio-os/kiosk-session)
          sh_scripts=(os/DEBIAN/postinst os/DEBIAN/prerm os/DEBIAN/postrm)
          for f in "${bash_scripts[@]}"; do bash -n "$f"; done
          for f in "${sh_scripts[@]}"; do sh -n "$f"; done
          shellcheck "${bash_scripts[@]}" "${sh_scripts[@]}"
      - name: Helper unit tests
        run: python3 -m unittest discover -s helper -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI typecheck, tests, build
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run typecheck
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  image:
    needs: checks
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Base image cache location
        run: echo "AUDIO_OS_CACHE_DIR=$RUNNER_TEMP/base-image" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd-container mtools dosfstools jq xz-utils gcc make libc6-dev
      - uses: actions/cache@v4
        with:
          path: ${{ env.AUDIO_OS_CACHE_DIR }}
          key: raspios-lite-arm64-2026-10-06
      - name: Build audio-os .deb
        run: os/build-deb.sh ui-dist out
      - name: Build image
        run: |
          deb=$(ls out/audio-os_*_arm64.deb)
          version=${deb#out/audio-os_}; version=${version%_arm64.deb}
          echo "IMAGE=out/audio-os-$version.img.xz" >> "$GITHUB_ENV"
          sudo --preserve-env=AUDIO_OS_CACHE_DIR image/build.sh "$deb" "out/audio-os-$version.img.xz"
      - name: Verify image (offline + boot test)
        run: sudo image/verify.sh "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-os-image
          path: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE }}.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          else
            tag=dev
            gh release delete dev --yes --cleanup-tag || true
          fi
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "audio-os $tag" --notes "Built from $GITHUB_REF_NAME at $GITHUB_SHA." \
            "$IMAGE" "$IMAGE.sha256"
