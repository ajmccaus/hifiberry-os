# Drop-in for touch-timeout.service, installed by beocreate-classic-ui (ADR 0002).
#
# While touch-timeout runs it is the only backlight writer; the Beocreate
# brightness slider reaches it only through this drop-in: the screen extension
# writes BEO_SCREEN_ARGS=-b <raw> to /etc/beocreate/touch-timeout.env and
# try-restarts the service. Both variables stay unbraced: systemd splits each at
# whitespace into zero or more arguments, so a missing file starts the daemon
# with its defaults instead of `-b ''`.
#
# Admins customise the daemon in /etc/default/touch-timeout, e.g.
# TOUCH_TIMEOUT_ARGS="-t 600", not with `systemctl edit`: an ExecStart override
# replaces this one, the daemon then never reads $BEO_SCREEN_ARGS, and the
# screen extension reports the slider unavailable. $BEO_SCREEN_ARGS comes last
# so the slider's -b wins (the pinned daemon's getopt keeps the last -b).
[Service]
EnvironmentFile=-/etc/default/touch-timeout
EnvironmentFile=-/etc/beocreate/touch-timeout.env
ExecStart=
ExecStart=/usr/bin/touch-timeout $TOUCH_TIMEOUT_ARGS $BEO_SCREEN_ARGS
