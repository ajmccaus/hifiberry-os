# Drop-in for touch-timeout.service, installed by beocreate-classic-ui (ADR 0002).
#
# touch-timeout is the only backlight writer while its unit is loaded; the
# Beocreate brightness slider reaches it only through this file: the screen
# extension writes BEO_SCREEN_ARGS=-b <raw> to /etc/beocreate/touch-timeout.env
# and restarts the service. $BEO_SCREEN_ARGS stays unbraced: systemd splits it
# at whitespace into zero or more arguments, so a missing file starts the
# daemon with its defaults instead of `-b ''`.
[Service]
EnvironmentFile=-/etc/beocreate/touch-timeout.env
ExecStart=
ExecStart=/usr/bin/touch-timeout $BEO_SCREEN_ARGS
