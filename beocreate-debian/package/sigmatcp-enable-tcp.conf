# Drop-in for sigmatcpserver.service, installed by beocreate-classic-ui.
#
# hbosng ships sigmatcpserver with --disable-tcp (REST API only). The classic
# Beocreate UI talks the raw SigmaTCP protocol on TCP port 8086 (DSP program
# upload, register read/write for tone control, equaliser, volume limit), so
# re-enable it. All other options match the shipped unit.
[Service]
ExecStart=
ExecStart=sigmatcpserver --localhost --enable-rest --alsa --store --restore
